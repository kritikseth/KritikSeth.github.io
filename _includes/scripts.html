
		<!-- Scripts -->
		<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/menu.js' | relative_url }}"></script>
		{%- if page.home %}
		<script src="{{ '/assets/js/three.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/TweenMax.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/particles.js' | relative_url }}"></script>
		<script>setTimeout(function () { document.body.classList.add('render'); }, 60);</script>
		{%- else %}
		<script>
			// Animated background for the page title banner. Skipped for visitors who prefer reduced motion.
			(function () {
				var el = document.getElementById('veins');
				if (!el || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
				var scripts = ["{{ '/assets/js/p5.min.js' | relative_url }}", "{{ '/assets/js/vanta.topology.min.js' | relative_url }}"];
				(function next() {
					if (!scripts.length) {
						VANTA.TOPOLOGY({
							el: el,
							mouseControls: true,
							touchControls: true,
							gyroControls: false,
							minHeight: 200.00,
							minWidth: 200.00,
							scale: 1.00,
							scaleMobile: 1.00,
							color: 0xff000d,
							backgroundColor: 0x220000
						});
						return;
					}
					var s = document.createElement('script');
					s.src = scripts.shift();
					s.onload = next;
					document.body.appendChild(s);
				})();
			})();
		</script>
		{%- endif %}

		<!-- Calendly badge widget -->
		<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
		<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
		<script>
			window.addEventListener('load', function () {
				if (!window.Calendly) return;
				Calendly.initBadgeWidget({ url: 'https://calendly.com/kritikseth/30min?hide_gdpr_banner=1&primary_color=ff0004', text: '1:1 with me', color: '#a20101', textColor: '#ffffff', branding: undefined });
			});
		</script>
